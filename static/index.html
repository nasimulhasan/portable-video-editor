<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Editor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Video Editor</div>
  <button id="addText" class="btn">+ Text</button>
  <button id="addShape" class="btn">+ Shape</button>
  <div id="shapeMenu" class="shapeMenu" hidden>
    <button type="button" data-shape="rect" title="Rectangle"><span class="si">▭</span> Rectangle</button>
    <button type="button" data-shape="roundrect" title="Rounded rectangle"><span class="si">▢</span> Rounded</button>
    <button type="button" data-shape="ellipse" title="Ellipse / circle"><span class="si">◯</span> Ellipse</button>
    <button type="button" data-shape="triangle" title="Triangle"><span class="si">△</span> Triangle</button>
    <button type="button" data-shape="diamond" title="Diamond"><span class="si">◇</span> Diamond</button>
    <button type="button" data-shape="star" title="Star"><span class="si">★</span> Star</button>
    <button type="button" data-shape="arrow" title="Filled arrow"><span class="si">➤</span> Arrow</button>
    <button type="button" data-shape="line" title="Line"><span class="si">─</span> Line</button>
    <button type="button" data-shape="linearrow" title="Thin line arrow"><span class="si">→</span> Line arrow</button>
  </div>
  <span class="sep"></span>
  <button id="undoBtn" class="btn sm" title="Undo (Ctrl+Z)">↩</button>
  <button id="redoBtn" class="btn sm" title="Redo (Ctrl+Y)">↪</button>
  <span class="sep"></span>
  <button id="saveBtn" class="btn sm" title="Save project">💾 Save</button>
  <button id="loadBtn" class="btn sm" title="Open project">📂 Open</button>
  <span class="sep"></span>
  <label class="hdrCheck" title="Show canvas rulers">
    <input type="checkbox" id="rulerToggle" checked>
    <span>Rulers</span>
  </label>
  <label class="hdrGuideColor" title="Ruler guide color">
    <span class="hdrColorLbl">Guide</span>
    <input type="color" id="guideColor" value="#22d3ee">
  </label>
  <div class="spacer"></div>
  <div id="exportStatus"></div>
  <div id="exportBar"><div id="exportFill"></div></div>
  <button id="exportBtn" class="btn accent">Export</button>
</header>

<main>
  <div id="editorCol">
    <div id="workspace">
      <aside id="mediaPane">
        <div class="mediaHead">
          <button id="importBtn" class="btn accent sm">+ Import</button>
          <div class="mediaTabs">
            <button class="tab on" data-filter="all">All</button>
            <button class="tab" data-filter="video">Video</button>
            <button class="tab" data-filter="audio">Audio</button>
            <button class="tab" data-filter="image">Image</button>
            <button class="tab" data-filter="srt">Subs</button>
          </div>
        </div>
        <div id="mediaGrid"></div>
      </aside>
      <div id="leftGrip" class="paneGrip" title="Drag to resize media pane">
        <button type="button" id="edgeToggleLeft" class="paneEdgeBtn" title="Hide media pane" aria-label="Hide media pane">‹</button>
      </div>
      <div id="stageCol">
        <div id="stageWrap">
          <div id="stageBoard">
            <div id="rulerCorner" title="Canvas rulers"></div>
            <div id="rulerHWrap" title="Drag down to add a horizontal guide">
              <canvas id="rulerH" height="22"></canvas>
            </div>
            <div id="rulerVWrap" title="Drag right to add a vertical guide">
              <canvas id="rulerV" width="22"></canvas>
            </div>
            <div id="stageSlot">
              <div id="stage">
                <div id="mainFrame">
                  <video id="video" playsinline preload="auto"></video>
                  <img id="lutStage" alt="">
                </div>
                <div id="fxTint"></div>
                <div id="fxVignette"></div>
                <div id="ovLayer"></div>
                <div id="guideLayer"></div>
                <div id="subPreview"></div>
                <div id="emptyHint">Import an image, music or video — export works without a main video clip</div>
              </div>
            </div>
          </div>
        </div>
        <div id="transport">
          <div class="transportLeft">
            <button id="splitBtn" class="btn sm iconBtn" title="Split at playhead (S)" aria-label="Split">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="6" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
              </svg>
            </button>
            <button id="dupBtn" class="btn sm iconBtn" title="Duplicate (Ctrl+D)" aria-label="Duplicate">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button id="deleteBtn" class="btn sm iconBtn" title="Delete selected (Del)" aria-label="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
            <button id="shotBtn" class="btn sm iconBtn" title="Screenshot current frame into media" aria-label="Screenshot">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
          </div>
          <div class="transportCenter">
            <button id="playBtn" class="btn round" title="Play / pause (Space)">▶</button>
            <span id="timeLabel">0:00.0 / 0:00.0</span>
          </div>
          <div class="transportRight">
            <span class="muted sm">Tracks</span>
            <button id="thOut" class="btn sm" title="Shorter tracks">−</button>
            <span id="thLabel">100%</span>
            <button id="thIn" class="btn sm" title="Taller tracks">+</button>
            <span class="sep"></span>
            <button id="zoomOut" class="btn sm" title="Zoom timeline out">−</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomIn" class="btn sm" title="Zoom timeline in">+</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tlGrip" title="Drag to resize timeline"></div>
    <div id="tlArea">
      <div id="tlSide">
        <div id="tlCorner"></div>
        <div id="tlHeads"></div>
      </div>
      <div id="tlScroll">
        <div id="timeline">
          <div id="ruler"></div>
          <div id="lanes"></div>
          <div id="tlGuide"></div>
          <div id="playhead"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="rightGrip" class="paneGrip" title="Drag to resize inspector">
    <button type="button" id="edgeToggleRight" class="paneEdgeBtn" title="Hide inspector" aria-label="Hide inspector">›</button>
  </div>
  <aside id="inspector"></aside>
</main>

<div id="exportModal" class="modal" hidden>
  <div class="modalCard">
    <h2>Export settings</h2>
    <div class="row"><span class="lbl">Format</span>
      <select id="exFormat">
        <option value="mp4">MP4 (H.264) — best compatibility</option>
        <option value="webm">WebM (VP9) — smaller web files</option>
      </select>
    </div>
    <div class="row"><span class="lbl">Resolution</span>
      <select id="exRes">
        <option value="original">Original (project size)</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </div>
    <div class="row"><span class="lbl">Quality</span>
      <select id="exQuality">
        <option value="high">High — larger file</option>
        <option value="medium">Medium — balanced</option>
        <option value="small">Small — lower bitrate</option>
      </select>
    </div>
    <div class="row"><span class="lbl">Frame rate</span>
      <select id="exFps">
        <option value="30">30 fps</option>
        <option value="24">24 fps</option>
        <option value="15">15 fps — smaller</option>
      </select>
    </div>
    <p class="muted" id="exHint">MP4 works everywhere. Lower resolution and Small quality shrink file size.</p>
    <div class="modalActions">
      <button class="btn" id="exportCancel">Cancel</button>
      <button class="btn accent" id="exportGo">Choose location & export…</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
